name: Build Matrimony Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"
      - ".github/workflows/.github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Extract app project
        run: |
          mkdir project
          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "Project ZIP not found"
            exit 1
          fi
          unzip -q "$ZIP_FILE" -d project
          test -f project/settings.gradle

      - name: Build APK
        run: gradle -p project assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: Ilangai-Makkal-Matrimony-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
